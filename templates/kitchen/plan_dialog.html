<dialog id="plan-dialog" class="dialog"><div class="dialog-top"><span class="eyebrow">SOMETHING TO LOOK FORWARD TO</span><button class="icon-button" data-close-dialog aria-label="Close meal planner">{% include 'kitchen/icon.html' with name='close' %}</button></div><h2>A little plan, a lovely meal.</h2><p>Pick a recipe and make room for it in your week.</p><form method="post" action="{% url 'plan_add' %}" id="plan-form">{% csrf_token %}<label class="field">Recipe<select name="recipe" id="plan-recipe" required><option value="">Choose something delicious…</option>{% for item in all_recipes %}<option value="{{ item.pk }}" data-servings="{{ item.servings }}">{{ item.title }}</option>{% endfor %}</select></label><div class="form-row"><label class="field">Day<input type="date" name="date" id="plan-date" value="{{ today|date:'Y-m-d' }}" required></label><label class="field">Meal<select name="meal" id="plan-meal"><option>Breakfast</option><option>Lunch</option><option selected>Dinner</option></select></label></div><label class="field">Servings<input type="number" name="servings" id="plan-servings" value="2" min="1" step="1" required></label><label class="field">Portions eaten at this meal<input type="number" name="portions_eaten" id="plan-portions-eaten" min="1" step="1" placeholder="Household portions"></label><p class="muted small">Leave blank to use household portions, up to the servings cooked.</p><p class="muted small">Choosing a filled slot will replace its current meal.</p><button class="button button-primary full-width" type="submit">{% include 'kitchen/icon.html' with name='plus' %}Add to my week</button></form></dialog>
